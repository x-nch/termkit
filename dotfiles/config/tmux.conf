# ~/.tmux.conf: Tmux configuration for TermKit

" Basic settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-shell $SHELL

" Prefix key (Ctrl-a instead of Ctrl-b)
set -g prefix C-a
unbind C-b

" Send prefix to other applications (nested tmux)
bind C-a send-prefix

" Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

" Set window and pane index starting from 1
set -g base-index 1
setw -g pane-base-index 1

" Enable mouse support
set -g mouse on

" Prevent automatic window renaming
set -g automatic-rename off
set -g allow-rename off

" Set terminal title
set -g set-titles on
set -g set-titles-string "#T - #W"

" History limit
set -g history-limit 50000

" Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

" Bell settings
set -g bell-action any
set -g bell-on-alert on

" Scrollback buffer
set -g history-limit 100000

" Time for repeat commands
set -g repeat-time 500

" Escape time
set -sg escape-time 1

" Pane border colors
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=colour240

" Message colors
set -g message-style fg=colour255,bg=colour235,bold

" Mode colors
setw -g mode-style fg=colour231,bg=colour237,bold

" Status bar
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-position bottom

" Status line colors
set -g status-style fg=colour250,bg=colour235

" Status left
set -g status-left-length 40
set -g status-left '#[fg=colour250,bg=colour240,bold] #S #[fg=colour240,bg=colour235] #[fg=colour250]#I:#P #[fg=colour250,bg=colour235]'

" Status right
set -g status-right-length 80
set -g status-right '#[fg=colour250,bg=colour240,bold] %Y-%m-%d #[fg=colour240,bg=colour235]#[fg=colour250,bg=colour240] %H:%M #[fg=colour240,bg=colour235]#[fg=colour250,bg=colour240]#(uptime | cut -d: -f4- | cut -d, -f1 | sed s/^\"//)'

" Window status
setw -g window-status-format '#[fg=colour245,bg=colour235] #I:#W #[fg=colour235,bg=colour235]'
setw -g window-status-current-format '#[fg=colour250,bg=colour240]#[fg=colour255,bg=colour240] #I:#W #[fg=colour240,bg=colour235]'

" Alert colors
setw -g window-status-activity-style fg=colour250,bg=colour240,bold
setw -g window-status-bell-style fg=colour255,bg=colour235,bold,reverse

" Window resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

" Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

" Create new window in current directory
bind c new-window -c "#{pane_current_path}"

" Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

" Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

" Last window/pane
bind Tab last-window
bind Space last-pane

" Kill pane/window/session
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "Kill window #W? (y/n)" kill-window
bind C-q confirm-before -p "Kill session #S? (y/n)" kill-session

" Copy mode settings
setw -g mode-keys vi

" Vi-style copy/paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
bind -T copy-mode-vi r send -X rectangle-toggle

" System clipboard integration
if-shell 'command -v xsel > /dev/null 2>&1' {
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
    bind-key p run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
}

if-shell 'command -v pbcopy > /dev/null 2>&1' {
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"
}

if-shell 'command -v clip.exe > /dev/null 2>&1' {
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
    bind-key p run "powershell.exe -command 'Get-Clipboard' | tmux load-buffer - ; tmux paste-buffer"
}

" Session management
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind s choose-tree -Zs

" Window management
bind w choose-tree -Zw

" Pane management
bind P display-panes

" Zoom pane
bind z resize-pane -Z

" Toggle mouse
bind m set -g mouse \; display "Mouse #{?mouse,enabled,disabled}"

" Toggle synchronize-panes
bind C-s setw synchronize-panes \; display "Synchronize-panes #{?synchronize-panes,enabled,disabled}"

" Quick commands
bind e command-prompt -p "Command:" "new-window -n '%1' '%1'"
bind I command-prompt -p "Install command:" "new-window -n 'install' '%1'"
bind U command-prompt -p "Update command:" "new-window -n 'update' '%1'"

" Environment variables
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM"
set-environment -g 'IGNOREEOF' 2

" Logging
bind pipe-pane -o "cat >>~/tmux-#{session_name}-#{window_name}-#I.log"

" System monitoring
bind M-s split-window -h "htop"
bind M-d split-window -h "df -h"
bind M-f split-window -h "free -h"

" File management
bind M-n split-window -h "mc"
bind M-v split-window -h "vim"

" Network tools
bind M-p split-window -h "ping google.com"
bind M-t split-window -h "traceroute google.com"
bind M-n split-window -h "netstat -tulnp"

" Git operations
bind G split-window -h "git status"
bind g split-window -h "git log --oneline -10"

" Search functionality
bind / command-prompt -p "Search:" "copy-mode -u ; send-keys '?%%%'"

" Conditional configuration for different systems
if-shell "uname | grep -q Darwin" {
    # macOS specific settings
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
    bind p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"
}

if-shell "uname | grep -q Linux" {
    # Linux specific settings
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
    bind p run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
}

" Plugin manager settings (if using tpm)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

" Initialize TPM (keep this line at the very bottom of tmux.conf)
if "test -f ~/.tmux/plugins/tpm/tpm" {
    run '~/.tmux/plugins/tpm/tpm'
}

" Local customization
if-shell "test -f ~/.tmux.conf.local" "source-file ~/.tmux.conf.local"

" End of TermKit tmux configuration